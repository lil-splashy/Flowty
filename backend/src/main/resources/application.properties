spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cozydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cozy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cozypass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:change-this-to-a-secure-256-bit-secret-in-production-please}
jwt.expiration=86400000
