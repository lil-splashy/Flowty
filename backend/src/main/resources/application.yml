spring:
  application:
    name: flowty
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowty}
    username: ${SPRING_DATASOURCE_USERNAME:flowtyuser}
    password: ${SPRING_DATASOURCE_PASSWORD:flowtypass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${APP_JWT_SECRET:flowty-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs