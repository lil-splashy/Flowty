services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/flowty
      - SPRING_DATASOURCE_USERNAME=flowtyuser
      - SPRING_DATASOURCE_PASSWORD=flowtypass
      - APP_JWT_SECRET=change-this-to-a-strong-random-secret-at-least-256-bits
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=flowty
      - MYSQL_USER=flowtyuser
      - MYSQL_PASSWORD=flowtypass
      - MYSQL_ROOT_PASSWORD=rootpass
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysqldata: