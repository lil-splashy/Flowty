services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cozydb
      POSTGRES_USER: cozy
      POSTGRES_PASSWORD: cozypass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cozydb
      SPRING_DATASOURCE_USERNAME: cozy
      SPRING_DATASOURCE_PASSWORD: cozypass
      JWT_SECRET: change-this-to-a-secure-256-bit-secret-in-production-please
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
