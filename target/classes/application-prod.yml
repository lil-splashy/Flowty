spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flowty}
    username: ${SPRING_DATASOURCE_USERNAME:flowtyuser}
    password: ${SPRING_DATASOURCE_PASSWORD:flowtypass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect